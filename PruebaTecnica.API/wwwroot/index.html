<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Tecnica - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #16213e; padding: 40px; border-radius: 10px; width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #e94560; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #a8a8b3; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 5px; background: #0f3460; color: #fff; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #c73652; }
        .error { color: #ff6b6b; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Iniciar Sesion</h2>
        <div class="form-group">
            <label>Correo</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label>Contrasena</label>
            <input type="password" id="password" placeholder="Tu contrasena">
        </div>
        <button class="btn" onclick="login()">Ingresar</button>
        <p class="error" id="error"></p>
    </div>
    <script>
        async function login() {
            var correo = document.getElementById('correo').value;
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            try {
                var res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: correo, password: password })
                });

                if (!res.ok) {
                    var data = await res.json();
                    errorEl.textContent = data.mensaje || 'Credenciales invalidas';
                    errorEl.style.display = 'block';
                    return;
                }

                var data = await res.json();
                window.__token = data.token;
                window.__usuario = data.usuario;
                document.cookie = 'token=' + data.token + '; path=/';
                document.cookie = 'usuario=' + JSON.stringify(data.usuario) + '; path=/';
                window.location.href = '/app.html?t=' + encodeURIComponent(data.token) + '&u=' + encodeURIComponent(JSON.stringify(data.usuario));
            } catch (e) {
                errorEl.textContent = 'Error de conexion';
                errorEl.style.display = 'block';
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
